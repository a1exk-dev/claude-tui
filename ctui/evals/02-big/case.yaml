# The #220 spike's big job (j6). Its delta is near zero; it is kept as the floor.
schema_version: "1.1"
name: big
description: Both calc.ts bugs fixed, two functions and a doc comment each added, tests written and run.
tags: [todo-nudge]
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-5-5
  max_turns: 40
  timeout_seconds: 900
  # Write for the test file, Bash(node:*) for `node --test`.
  allowed_tools: [Read, Glob, Grep, Edit, Write, "Bash(node:*)", TaskCreate, TaskList, TaskUpdate]
  prompt: |
    In calc.ts: fix the bugs in add and mul, add sub(a, b) and div(a, b) where div throws on a zero divisor, add a doc comment to every function, write node:test tests in calc.test.ts covering all four, then run them with `node --test` and fix any failures.
# tool_order names one tool per side, so this grader names the write this job
# cannot avoid: it must create calc.test.ts, while fixing calc.ts can go through
# either Edit or a whole-file Write. On 2026-10-13 every run of both arms chose
# Write for calc.ts and Edit was never called, which failed the grader on its
# own naming rather than on what the arms did. The gap that remains is narrower
# and in the other direction: a run that edited calc.ts before starting its list
# and only then wrote the test file would still pass.
graders:
  - name: list-before-first-write
    type: tool_order
    before: TaskCreate
    after: Write
    arm: both
