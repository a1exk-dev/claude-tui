<!doctype html>
<!--
  The source of the design renders in this folder: renders 1–3 the Sidebar,
  4–7 the `/ctui` menu's four screens in its `Settings` tab, docked in the
  Sidebar's place.

  Open it with ?render=1 … 7 for one render at its 1320×810 size; with no
  query it shows all seven. To re-export the PNGs after an edit, from the repo root:

    for r in 1:sidebar-1-all-folded 2:sidebar-2-some-folded 3:sidebar-3-all-expanded \
      4:menu-1-top 5:menu-2-plugins 6:menu-3-plugin 7:menu-4-themes; do
      npx -y playwright@1.63.0 screenshot --viewport-size=1320,810 \
        "file://$PWD/docs/design/sidebar.html?render=${r%%:*}" "docs/design/${r#*:}.png"
    done

  The grid is 14px JetBrainsMono Nerd Font, the installed font the renders
  were first drawn in: 8.4px columns, 20.25px rows. The Sidebar's spacing is in
  whole rows, as Claude Code lays it out: a faint `─` rule across the body
  between every two sections, 1 row under an expanded title and 1 row after an
  expanded section before the rule, none after a folded one. A faint `═` rule
  with 1 blank row on each side parts the git header from the sections. In
  the header, 1 blank row parts the path from the git rows, each led by its
  Devicons glyph in muted and one space: U+E725 branch, U+E702 changeset,
  U+E728 lines. The header keeps those Devicons by the exemption in
  `docs/adr/0003-one-glyph-one-colour.md`; every section row draws the
  shared circle vocabulary of `ctui/plugins/marks.tsx` instead, each mark
  followed by the two spaces a Nerd Font icon takes, so a row's text starts
  at column 3 and its label truncates a column earlier. A fold line draws the
  same marks as a tally, mark then count, both in the mark's role, two spaces
  between terms.
  At the Sidebar's 42 columns the footer takes two rows: `claude cli: <v>`,
  then `ctui: <v>, <Theme name>`.

  The menu draws as `menuView()` in `ctui/hooks/menu.tsx` ships it: a bold
  breadcrumb (` › ` muted), blank, faint `═`, blank, the screen's rows, then a
  faint `─` and a footer of `key: label` pairs (key main, label muted, faint
  ` · `) on the last body rows, wrapping whole pairs at 38 columns. Each row
  leads with the engine's one-cell `›` Button: dim (the `/theme`'s muted) at
  rest, inverse on the ringed row, whose label is bold accent (`suggestion`,
  the renders' purple). Field labels are ctui Text, `Monthly cost` padded to
  14 cells; the field itself (value, dim placeholder, inverse cursor,
  `⏎ submit`) is the engine's, in the `/theme`'s colors. Each screen shows as
  it opens: the ring on the first row, on Themes in the filter. At 37 body
  rows the Themes window holds all 23 rows, so neither `more` row shows.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design renders</title>
<style>
  :root {
    --row: 20.25px;
    --col: 8.4px;
    --outside: #050505;
    --frame: #222222;
    --titlebar: #111111;
    --dot: #333333;
    --bg: #0a0a0a;
    --panel: #141414;
    --border: #484848;
    --main: #eeeeee;
    --muted: #808080;
    --faint: #484848;
    --placeholder: #767676;
    --chevron: #797979;
    --line-number: #a0a0a0;
    --green: #7fd88f;
    --red: #e06c75;
    --orange: #f5a742;
    --peach: #fab283;
    --purple: #9d7cd8;
    --diff-del: #37222c;
    --diff-add: #20303b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--outside); }
  body {
    font: 14px/var(--row) 'JetBrainsMono Nerd Font', monospace;
    font-variant-ligatures: none;
    color: var(--main);
    -webkit-font-smoothing: antialiased;
  }
  body.all { display: flex; flex-direction: column; gap: 24px; padding: 24px; align-items: center; }

  .window {
    position: relative; width: 1320px; height: 810px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--frame); border-radius: 10px;
  }
  .titlebar {
    position: absolute; left: 0; right: 0; top: 0; height: 28px; background: var(--titlebar);
    font-size: 12px; line-height: 26px; letter-spacing: 0; color: var(--muted); padding-left: 71px;
  }
  .titlebar i { position: absolute; top: 9px; width: 11px; height: 11px; border-radius: 50%; background: var(--dot); }

  .row { height: var(--row); white-space: pre; }
  .split { display: flex; justify-content: space-between; }
  .m { color: var(--muted); } .f { color: var(--faint); }
  .g { color: var(--green); } .r { color: var(--red); } .o { color: var(--orange); }
  .p { color: var(--peach); } .v { color: var(--purple); } .ln { color: var(--line-number); }
  b { font-weight: 700; }

  /* Transcript */
  .transcript { position: absolute; left: 0; top: 57px; width: 965px; }
  .transcript > .row { padding-left: 42px; }
  .prompt {
    width: 840px; margin-left: 17px; padding-left: 25px;
    background: linear-gradient(var(--green), var(--green)) 2.5px 0 / 3px 100% no-repeat, var(--panel);
  }
  .code { margin-left: 59px; width: 789px; background: var(--panel); }
  .code .del { background: var(--diff-del); } .code .add { background: var(--diff-add); }
  .input {
    position: absolute; left: 17px; top: 755px; width: 931px; height: 29px;
    border: 1px solid var(--border); border-radius: 4px; padding-left: 10px;
    line-height: 28px; color: var(--placeholder);
  }
  .mode { position: absolute; left: 25px; width: 915px; top: 784px; }

  /* Sidebar */
  .sidebar { position: absolute; left: 965px; right: 0; top: 0; bottom: 0; background: var(--panel); }
  .body {
    position: absolute; left: 17px; width: calc(38 * var(--col)); top: 36.5px; bottom: 9px;
    display: flex; flex-direction: column;
  }
  .fill { flex: 1; }
  .gap { height: var(--row); }
  .indent { padding-left: calc(2 * var(--col)); }
  .more { text-align: right; }
  .a { color: var(--purple); }
  .ring { background: var(--main); color: var(--panel); }
  .footer { display: flex; flex-wrap: wrap; }
  .footer > span { height: var(--row); white-space: pre; }
</style>
</head>
<body>
<script>
  // What each render shows: for the Sidebar, a fold state per Sidebar plugin
  // and whether the sections window overflows into `↓ more`; for the menu, its
  // screen. `file` is the PNG it exports to.
  const RENDERS = {
    1: { file: 'sidebar-1-all-folded', expanded: [] },
    2: { file: 'sidebar-2-some-folded', expanded: ['skills', 'agents'] },
    3: { file: 'sidebar-3-all-expanded', expanded: ['context', 'limits', 'todo', 'skills', 'mcp', 'agents'], more: true },
    4: { file: 'menu-1-top', menu: 'top' },
    5: { file: 'menu-2-plugins', menu: 'plugins' },
    6: { file: 'menu-3-plugin', menu: 'plugin' },
    7: { file: 'menu-4-themes', menu: 'themes' },
  }

  const span = (cls, text) => `<span class="${cls}">${text}</span>`
  const row = (html, cls = '') => `<div class="row ${cls}">${html}</div>`
  const split = (left, right, cls = '') => row(`<span>${left}</span><span>${right}</span>`, `split ${cls}`)
  const bar = (percent, cells, color) => {
    const filled = Math.round((percent / 100) * cells)
    return span(color, '━'.repeat(filled)) + span('f', '─'.repeat(cells - filled))
  }

  // The Sidebar's shared circle vocabulary, as `ctui/plugins/marks.tsx` draws
  // it, by the `nf-md-` name of each glyph.
  const DONE = '\u{f0133}' // checkbox_marked_circle: a todo done, a task completed
  const WAITING = '\u{f0130}' // checkbox_blank_circle_outline: a todo still waiting
  const OK = '\u{f05e1}' // check_circle_outline: an MCP server with tools
  const GONE = '\u{f0159}' // close_circle: an MCP server down, a task ended any other way
  const OFF = '\u{f0377}' // minus_circle_outline: an MCP server disabled
  const REST = '\u{f1a27}' // asterisk_circle_outline: a skills row, the one state it has
  const SWEEP = '\u{f0aa1}' // circle_slice_4: one frame of a working row's sweep
  const FROZEN = '\u{f0aa3}' // circle_slice_6: the frame a fold line's working term freezes at

  // A row's lead: the mark in its colour role, then the two spaces every Nerd
  // Font icon takes, so the row's text starts at column 3.
  const mark = (cls, glyph) => span(cls, glyph) + '  '
  // A fold line's tally: each term's mark, two spaces, its count, all in the
  // mark's own role, with two spaces between terms.
  const tally = (terms) => terms.map(([cls, glyph, count]) => span(cls, `${glyph}  ${count}`)).join('  ')

  // Each section: its title, the right side folded (summary) and expanded
  // (count), and its body rows. A list shows its first `cap` rows (4 unless
  // it sets its own) plus a `▸ N more` row unless the render expands it.
  const SECTIONS = [
    {
      id: 'context', title: 'Context',
      summary: span('m', '9%'),
      body: () => [
        split(bar(9, 20, 'g'), '9%'),
        row(span('m', '18,402 / 200k tokens')),
      ],
    },
    {
      id: 'limits', title: 'Limits',
      summary: span('m', '62$ · 5h 34% · wk 81%'),
      body: () => [
        split(`cost   ${bar(62, 20, 'o')}`, '62%'),
        row(span('m', '       62.00$ of 100$')),
        split(`5h     ${bar(34, 20, 'g')}`, '34%'),
        row(span('m', '       resets in 2h 17m')),
        split(`week   ${bar(81, 20, 'o')}`, '81%'),
        row(span('m', '       resets in 3d 4h, Mon 09:00')),
      ],
    },
    {
      id: 'todo', title: 'Todo',
      // Folded, a tally of the three states: how much is done, not what is
      // happening, so the current task's `activeForm` goes.
      summary: tally([['g', DONE, 2], ['o', FROZEN, 1], ['f', WAITING, 5]]),
      count: span('m', '2/8'),
      cap: 8,
      list: [
        row(`${mark('g', DONE)}${span('m', 'read sync command')}`),
        row(`${mark('g', DONE)}${span('m', 'add the flag')}`),
        row(`${mark('o', SWEEP)}write the test`),
        row(`${mark('f', WAITING)}${span('m', 'update README')}`),
        row(`${mark('f', WAITING)}${span('m', 'add --dry-run to help text')}`),
        row(`${mark('f', WAITING)}${span('m', 'check Windows paths')}`),
        row(`${mark('f', WAITING)}${span('m', 'run full test suite')}`),
        row(`${mark('f', WAITING)}${span('m', 'write changelog entry')}`),
      ],
    },
    {
      id: 'skills', title: 'Skills',
      // One state, so one term before the count.
      summary: tally([['m', REST, 5]]),
      count: span('m', '5'),
      // A–Z by name, then source; a long name truncates, the source never does.
      list: [
        split(`${mark('m', REST)}artifact-capabi…`, span('m', 'anthropic-skills')),
        split(`${mark('m', REST)}git-guardrails-claude-code`, span('m', 'user')),
        split(`${mark('m', REST)}review`, span('m', 'code-tools')),
        split(`${mark('m', REST)}review`, span('m', 'pr-kit')),
        split(`${mark('m', REST)}tdd`, span('m', 'user')),
      ],
    },
    {
      id: 'mcp', title: 'MCP',
      // Folded, a tally in the states' own order, so the terms sum to the
      // listed servers.
      summary: tally([['g', OK, 5], ['r', GONE, 1], ['f', OFF, 1]]),
      count: span('m', '5/7'),
      // A–Z, off rows last; the source and its · muted, the status in its role.
      list: [
        split(`${mark('g', OK)}Claude Docs`, span('m', 'claude.ai · 9 tools')),
        split(`${mark('g', OK)}context7`, span('m', 'context7 · 2 tools')),
        split(`${mark('g', OK)}linear`, span('m', 'claude.ai · 31 tools')),
        split(`${mark('g', OK)}playwright`, span('m', 'user · 22 tools')),
        split(`${mark('g', OK)}postgres`, span('m', 'project · 6 tools')),
        split(`${mark('r', GONE)}sentry`, `${span('m', 'user · ')}${span('r', 'down')}`),
        split(`${mark('f', OFF)}github`, span('m', 'user · off')),
      ],
    },
    {
      id: 'agents', title: 'Agents &amp; shells',
      // Folded, every state the section holds, its running term the frozen
      // sweep frame, because a fold line never animates.
      summary: tally([['o', FROZEN, 3], ['g', DONE, 1], ['r', GONE, 1]]),
      count: span('m', '3 running'),
      // One mark, and it means state. The kind is a muted word at the right
      // beside the elapsed time, in the half that never shrinks, so the name
      // takes the bright truncating slot at the left and an ended row's
      // reason follows it there. Rows in start order, each held task under
      // its parent.
      list: [
        split(`${mark('g', DONE)}glyph sweep`, span('m', 'workflow · 3m 11s')),
        split(`${mark('r', GONE)}npm test${span('m', ' · killed')}`, span('m', 'shell · 41s')),
        split(`${mark('o', SWEEP)}map the auth fl…`, span('m', 'Explore · 1m 15s')),
        split(`  ${span('m', '└ ')}${mark('o', SWEEP)}read M…`, span('m', 'general-purpose · 21s')),
        split(`${mark('o', SWEEP)}bun test --watch`, span('m', 'shell · 5m 03s')),
      ],
    },
  ]
  const CAP = 4
  // The `─` rule between two sections, across the body's 38 columns.
  const RULE = row(span('f', '─'.repeat(38)))
  // The sections window's rows above `↓ more`: 37 body rows less the header
  // (5), the double rule's 3, `↓ more`, the footer's gap and the footer (2).
  const ROOM = 37 - 5 - 3 - 1 - 1 - 2

  // The sections as scroll stops, as `sidebar()` builds them: a title's stop
  // holds the blank row and rule before it and its own blank row. With
  // `↓ more`, only the stops that fit `ROOM` whole show.
  function sections(render) {
    const stops = []
    let previous = 'none'
    for (const section of SECTIONS) {
      const expanded = render.expanded.includes(section.id)
      let title = ''
      let height = 1
      if (previous === 'expanded') (title += '<div class="gap"></div>'), height++
      if (previous !== 'none') (title += RULE), height++
      previous = expanded ? 'expanded' : 'folded'
      const right = expanded ? (section.count ?? '') : section.summary
      title += split(`${span('m', expanded ? '▼' : '▶\uFE0E')} <b>${section.title}:</b>`, right)
      if (expanded) (title += '<div class="gap"></div>'), height++
      stops.push({ html: title, height })
      if (!expanded) continue
      let body = section.body ? section.body() : section.list
      if (section.list) {
        const cap = section.cap ?? CAP
        if (render.lists?.includes(section.id)) body = [...body, row(span('m', '▾ show less'))]
        else if (body.length > cap) body = [...body.slice(0, cap), row(span('m', `▸ ${body.length - cap} more`))]
      }
      stops.push(...body.map((html) => ({ html: `<div class="indent">${html}</div>`, height: 1 })))
    }
    let used = 0
    const shown = render.more ? stops.filter((stop) => (used += stop.height) <= ROOM) : stops
    return shown.map((stop) => stop.html).join('')
  }

  // The `/ctui` menu: each screen's breadcrumb, rows and footer keys, as
  // `menuView()` draws them. A row is the `›` cell, a space, then its lead,
  // label and right value; `ring` marks the row that holds the ring.
  const menuRow = ({ label, lead = '', right = '', ring = false }) =>
    split(`${ring ? span('ring', '›') : span('m', '›')} ${lead}${ring ? span('a', `<b>${label}</b>`) : label}`, right)
  // Sections in registry order: Plugins lists them with an eye (shown) or
  // eye-slash (hidden), and their Start folded state at the right.
  const PLUGINS = [
    { title: 'Context', enable: true, folded: false },
    { title: 'Limits', enable: true, folded: false },
    { title: 'Todo', enable: true, folded: true },
    { title: 'Skills', enable: true, folded: true },
    { title: 'MCP', enable: false, folded: false },
    { title: 'Agents &amp; shells', enable: true, folded: false },
  ]
  const THEMES = ['inherit', 'Catppuccin', 'Catppuccin Latte', 'Ethereal', 'Everforest', 'Flexoki Light', 'Gruvbox',
    'Hackerman', 'Kanagawa', 'Last Horizon', 'Lumon', 'Lupine', 'Matte Black', 'Miasma', 'Nord', 'Osaka Jade',
    'Retro 82', 'Ristretto', 'Rose Pine', 'Solitude', 'Tokyo Night', 'Vantablack', 'White']
  const PLACEHOLDER = 'type to filter'
  const SCREENS = {
    top: {
      crumbs: [],
      rows: () => [
        menuRow({ label: 'Plugins', right: span('m', `${PLUGINS.filter((p) => p.enable).length}/${PLUGINS.length} ›`), ring: true }),
        menuRow({ label: 'Themes', right: span('m', 'inherit ›') }),
      ],
      footer: [['↑↓', 'move'], ['enter', 'open'], ['esc', 'close']],
    },
    plugins: {
      crumbs: ['Plugins'],
      rows: () => PLUGINS.map(({ title, enable, folded }, index) => menuRow({
        label: title,
        lead: enable ? span('g', '\u{f06e}  ') : span('m', '\u{f070}  '),
        right: span('m', folded ? 'folded ›' : 'expanded ›'),
        ring: index === 0,
      })),
      footer: [['↑↓', 'move'], ['enter', 'settings'], ['x', 'show/hide'], ['k/j', 'move row'], ['esc', 'back']],
    },
    plugin: {
      crumbs: ['Plugins', 'Limits'],
      rows: () => [
        menuRow({ label: 'Start folded', right: span('m', 'off'), ring: true }),
        menuRow({ label: 'Cost', right: span('m', 'auto') }),
        row(`  ${'Monthly cost'.padEnd(14)}100`),
      ],
      footer: [['↑↓', 'move'], ['enter', 'change'], ['esc', 'back']],
    },
    themes: {
      crumbs: ['Themes'],
      rows: () => [
        // The focused filter: the cursor inverse on the placeholder's first cell.
        split(`${span('a', '<b>filter </b>')}${span('ring', PLACEHOLDER[0])}${span('m', PLACEHOLDER.slice(1))}`, span('m', '⏎ submit')),
        // The field's blank row, then the window's `↑ more` and `↓ more` rows:
        // blank, as all 23 rows fit.
        row(''),
        row(''),
        ...THEMES.map((name) => menuRow({ label: name, right: name === 'inherit' ? span('a', '●') : '' })),
        row(''),
      ],
      footer: [['type', 'filter'], ['↑↓', 'move'], ['enter', 'pick'], ['esc', 'back']],
    },
  }

  function menu(level) {
    const screen = SCREENS[level]
    const crumbs = screen.crumbs.map((crumb) => `${span('m', ' › ')}${crumb}`).join('')
    const footer = screen.footer
      .map(([key, label], index) => `<span>${key}:${span('m', ` ${label}`)}${index < screen.footer.length - 1 ? span('f', ' · ') : ''}</span>`)
      .join('')
    return `
      ${row(`<b>Settings${crumbs}</b>`)}
      ${row('')}
      ${row(span('f', '═'.repeat(38)))}
      ${row('')}
      ${screen.rows().join('')}
      <div class="fill"></div>
      ${row(span('f', '─'.repeat(38)))}
      <div class="footer">${footer}</div>`
  }

  function sidebar(render) {
    return `
          ${row('<b>~/Projects/open-claude-mod</b>')}
          ${row('')}
          ${row(`${span('m', '\ue725')} main`)}
          ${row(`${span('m', '\ue702')} ⇡2  ⇣0  ${span('g', '+1')}  ${span('o', '!3')}  ${span('m', '?2')}  ${span('v', '≡1')}`)}
          ${row(`${span('m', '\ue728')} ${span('g', '+24')} ${span('r', '-1')} ${span('m', 'lines changed')}`)}
          ${row('')}
          ${row(span('f', '═'.repeat(38)))}
          ${row('')}
          ${sections(render)}
          ${render.more ? row(span('m', '↓ more'), 'more') : ''}
          <div class="fill"></div>
          ${row('')}
          ${row(`${span('m', 'claude cli:')} 2.1.292`)}
          ${row(`${span('m', 'ctui:')} 0.4.0, inherit`)}`
  }

  const TRANSCRIPT = `
    <div class="prompt">
      ${row('')}${row('Add a --dry-run flag to the sync command and cover it with a test.')}${row('')}
    </div>
    ${row('')}
    ${row('I\'ll check how the sync command parses its flags first.')}
    ${row('')}
    ${row(`→ Read  src/commands/sync.ts ${span('m', '· 212 lines')}`)}
    ${row(`* Grep  "parseFlags" ${span('m', '· 3 matches')}`)}
    ${row(`← Edit  src/commands/sync.ts ${span('m', '·')} ${span('g', '+2')} ${span('r', '-1')}`)}
    <div class="code">
      ${row(`${span('ln', ' 41')}    const flags = parseFlags(argv, {`)}
      ${row(`${span('ln', ' 42')}  -   force: Boolean`, 'del')}
      ${row(`${span('ln', ' 42')}  +   force: Boolean,`, 'add')}
      ${row(`${span('ln', ' 43')}  +   dryRun: Boolean,`, 'add')}
      ${row(`${span('ln', ' 44')}    })`)}
    </div>
    ${row(`$ Bash  bun test sync ${span('g', '· 14 passed')}`)}
    ${row('')}
    ${row(`Added ${span('p', '--dry-run')}. It prints the planned writes and exits before touching disk. The new test in`)}
    ${row(`${span('p', 'sync.test.ts')} covers it.`)}
    ${row('')}
    ${row(`${span('g', '▣')} ${span('m', 'accept edits · claude-opus-5-5 · 12.3s')}`)}
  `

  function draw(n) {
    const render = RENDERS[n]
    return `
      <div class="window" id="render-${n}" title="${render.file}.png">
        <div class="titlebar"><i style="left:10px"></i><i style="left:27px"></i><i style="left:44px"></i>~/Projects/open-claude-mod — claude</div>
        <div class="transcript">${TRANSCRIPT}</div>
        <div class="input"><span style="color:var(--chevron)">&gt;</span> Ask anything</div>
        <div class="mode split row"><span>claude-opus-5-5 ${span('m', '· high effort')}</span>${span('g', '⏵⏵ accept edits')}</div>
        <div class="sidebar"><div class="body">${render.menu ? menu(render.menu) : sidebar(render)}</div></div>
      </div>`
  }

  const only = new URLSearchParams(location.search).get('render')
  if (!only) document.body.classList.add('all')
  document.body.innerHTML = (only ? [only] : Object.keys(RENDERS)).map(draw).join('')
</script>
</body>
</html>
